name: Native toolchain
description: Install only the selected catalog backend dependencies
inputs:
  backend:
    description: Catalog backend
    required: true
  compile:
    description: Whether this lane compiles native code
    default: 'true'
runs:
  using: composite
  steps:
    - name: Linux base
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential ffmpeg
    - name: Linux Vulkan
      if: runner.os == 'Linux' && inputs.backend == 'vulkan'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers
    - name: ROCm 6.1
      if: runner.os == 'Linux' && inputs.backend == 'rocm'
      shell: bash
      run: |
        curl --fail --silent --show-error https://repo.radeon.com/rocm/rocm.gpg.key -o /tmp/rocm.key
        gpg --show-keys --with-fingerprint /tmp/rocm.key
        sudo gpg --dearmor -o /usr/share/keyrings/rocm.gpg /tmp/rocm.key
        echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/6.1 jammy main' | sudo tee /etc/apt/sources.list.d/rocm.list
        printf '%s\n' 'Package: *' 'Pin: release o=repo.radeon.com' 'Pin-Priority: 600' | sudo tee /etc/apt/preferences.d/rocm-pin-600
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends rocm-dev hip-dev hipblas-dev rocblas-dev
        echo 'ROCM_PATH=/opt/rocm' >> "$GITHUB_ENV"
        echo 'HIP_PATH=/opt/rocm' >> "$GITHUB_ENV"
        echo '/opt/rocm/bin' >> "$GITHUB_PATH"
        echo '/opt/rocm/llvm/bin' >> "$GITHUB_PATH"
        echo 'LD_LIBRARY_PATH=/opt/rocm/lib' >> "$GITHUB_ENV"
    - name: Install CUDA-compatible MSVC 14.39
      if: runner.os == 'Windows' && inputs.backend == 'cuda' && inputs.compile == 'true'
      shell: pwsh
      run: |
        $installerRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
        $installation = & (Join-Path $installerRoot 'vswhere.exe') -latest -products '*' -property installationPath
        if (-not $installation) { throw 'Visual Studio installation not found' }
        $arguments = @('modify', '--installPath', "`"$installation`"", '--add', 'Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64', '--quiet', '--norestart')
        $process = Start-Process -FilePath (Join-Path $installerRoot 'setup.exe') -ArgumentList $arguments -Wait -PassThru
        if ($process.ExitCode -notin @(0, 3010)) { throw "MSVC component installation failed: $($process.ExitCode)" }
    - name: MSVC
      if: runner.os == 'Windows' && inputs.compile == 'true'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        toolset: ${{ inputs.backend == 'cuda' && '14.39' || '' }}
    - name: CUDA 12.4.1
      if: inputs.backend == 'cuda'
      uses: Jimver/cuda-toolkit@4bd727d5619dc6fa323b1e76c3aa5dca94f5ec6d # v0.2.19
      with:
        cuda: '12.4.1'
        method: network
    - name: Windows Vulkan
      if: runner.os == 'Windows' && inputs.backend == 'vulkan'
      shell: pwsh
      run: |
        $version = '1.4.357.0'
        $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" -OutFile $installer
        $expected = '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d'
        $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
        if ($actual -ne $expected) { throw "Vulkan SDK digest mismatch: $actual" }
        $process = Start-Process -FilePath $installer -ArgumentList @('--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($process.ExitCode)" }
        $sdk = "C:/VulkanSDK/$version"
        if (-not (Test-Path "$sdk/Bin/glslc.exe")) { throw 'Vulkan SDK glslc.exe was not installed' }
        if (-not (Test-Path 'C:/Windows/System32/vulkan-1.dll')) { throw 'Vulkan runtime loader was not installed' }
        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "$sdk/Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: macOS tools
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja ffmpeg
