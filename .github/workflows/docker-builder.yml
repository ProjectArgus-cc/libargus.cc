name: Build & Publish GHCR Builder Image

on:
  push:
    branches:
      - '*'
    paths:
      - '.github/docker/Dockerfile.builder'
      - '.github/workflows/docker-builder.yml'
  workflow_dispatch:


permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push GHCR Docker Builder Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Repository Name
        id: image_name
        run: |
          echo "image_id=ghcr.io/${{ github.repository_owner }}/libargus-builder" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/docker/Dockerfile.builder
          push: true
          tags: |
            ${{ steps.image_name.outputs.image_id }}:latest
            ${{ steps.image_name.outputs.image_id }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
