name: Release & Deployment Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.7.3)'
        required: true
        default: '1.7.3'

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. Build Cross-Platform Native Shared Libraries
  # =========================================================================
  build-native-artifacts:
    name: Build Native Artifacts (${{ matrix.platform }}-${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: cpu
            os: ubuntu-latest
            cmake_flags: "-DGGML_CUDA=OFF -DGGML_METAL=OFF"
          - platform: linux-x86_64
            target: cuda
            os: ubuntu-latest
            cmake_flags: "-DGGML_CUDA=ON -DGGML_METAL=OFF"
          - platform: linux-x86_64
            target: rocm
            os: ubuntu-22.04
            cmake_flags: '-DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_HIP=ON "-DAMDGPU_TARGETS=gfx906;gfx908;gfx90a;gfx1030;gfx1100"'
          - platform: linux-x86_64
            target: vulkan
            os: ubuntu-latest
            cmake_flags: "-DGGML_CUDA=OFF -DGGML_VULKAN=ON"
          - platform: windows-x86_64
            target: cpu
            os: windows-latest
            cmake_flags: "-DGGML_CUDA=OFF"
          - platform: windows-x86_64
            target: cuda
            os: windows-2022
            cmake_flags: "-DGGML_CUDA=ON -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler"

          - platform: windows-x86_64
            target: vulkan
            os: windows-latest
            cmake_flags: "-DGGML_CUDA=OFF -DGGML_VULKAN=ON"
          - platform: macos-aarch64
            target: metal
            os: macos-14
            cmake_flags: "-DGGML_METAL=ON -DGGML_CUDA=OFF"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up System Dependencies (Linux)
        if: runner.os == 'Linux' && matrix.target != 'rocm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libvulkan-dev vulkan-tools mesa-vulkan-drivers glslc libshaderc-dev nvidia-cuda-toolkit

      - name: Set up ROCm and HIP Toolchain (Linux ROCm)
        if: runner.os == 'Linux' && matrix.target == 'rocm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg2 build-essential cmake ninja-build
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/rocm-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/rocm-keyring.gpg] https://repo.radeon.com/rocm/apt/6.1 jammy main' | sudo tee /etc/apt/sources.list.d/rocm.list
          echo -e 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rocm-dev hip-dev hipblas-dev rocblas-dev
          echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "HIP_PATH=/opt/rocm" >> $GITHUB_ENV
          echo "/opt/rocm/bin" >> $GITHUB_PATH
          echo "/opt/rocm/llvm/bin" >> $GITHUB_PATH


      - name: Set up MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && matrix.target == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.4.1'
          method: 'network'

      - name: Set up Vulkan SDK (Windows)
        if: runner.os == 'Windows' && matrix.target == 'vulkan'
        run: |
          choco install vulkan-sdk -y
          VULKAN_DIR=$(ls -d /c/VulkanSDK/* | tail -n 1)
          echo "VULKAN_SDK=$VULKAN_DIR" >> $GITHUB_ENV
          echo "$VULKAN_DIR/Bin" >> $GITHUB_PATH


      - name: Configure CMake
        run: |
          CMAKE_FLAGS=()
          case "${{ matrix.target }}" in
            cpu)
              CMAKE_FLAGS=(-DGGML_CUDA=OFF -DGGML_METAL=OFF)
              ;;
            cuda)
              if [ "${{ runner.os }}" = "Windows" ]; then
                CMAKE_FLAGS=(-DGGML_CUDA=ON -DCMAKE_CUDA_FLAGS=-allow-unsupported-compiler)
              else
                CMAKE_FLAGS=(-DGGML_CUDA=ON -DGGML_METAL=OFF)
              fi
              ;;
            rocm)
              CMAKE_FLAGS=(
                -DGGML_CUDA=OFF
                -DGGML_METAL=OFF
                -DGGML_HIP=ON
                -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang
                -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++
                -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
                "-DAMDGPU_TARGETS=gfx906;gfx908;gfx90a;gfx1030;gfx1100"
              )
              ;;
            vulkan)
              CMAKE_FLAGS=(-DGGML_CUDA=OFF -DGGML_VULKAN=ON)
              ;;
            metal)
              CMAKE_FLAGS=(-DGGML_METAL=ON -DGGML_CUDA=OFF)
              ;;
          esac

          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARGUS_PORTABLE=ON "${CMAKE_FLAGS[@]}"

      - name: Compile Native Binary
        run: |
          cmake --build build --config Release -j 4

      - name: Verify Compiled Features
        run: |
          if [ -f build/bin/test_libargus ]; then
            ./build/bin/test_libargus --features-only --expect-features ${{ matrix.target }}
          elif [ -f build/bin/Release/test_libargus.exe ]; then
            ./build/bin/Release/test_libargus.exe --features-only --expect-features ${{ matrix.target }}
          elif [ -f build/bin/test_libargus.exe ]; then
            ./build/bin/test_libargus.exe --features-only --expect-features ${{ matrix.target }}
          fi

      - name: Stage Native Binary
        run: |
          mkdir -p staging
          find build -type f \( -name "libargus.so" -o -name "argus.dll" -o -name "libargus.dylib" \) -exec cp {} staging/ \;
          echo "Staged native binary artifacts:"
          ls -la staging/

      - name: Upload Native Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.target }}
          path: staging/*
          if-no-files-found: error

  # =========================================================================
  # 2. Package Java Modular Classifier Jars & Create GitHub Release
  # =========================================================================
  publish-release:
    name: Package Jars & Publish Release
    needs: build-native-artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Download All Compiled Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-binaries

      - name: Copy Downloaded Native Libraries to Fine-Grained Subproject Resource Directories
        run: |
          set -euo pipefail

          copy_native() {
            local src_dir="$1"
            local dest_dir="$2"
            local pattern="$3"

            mkdir -p "$dest_dir"
            local file
            file=$(find "$src_dir" -type f -name "$pattern" 2>/dev/null | head -n 1)

            if [ -z "$file" ] || [ ! -f "$file" ]; then
              echo "::error::Required native binary '$pattern' not found under '$src_dir'!" >&2
              exit 1
            fi

            cp "$file" "$dest_dir/"
            local size
            size=$(stat -c%s "$dest_dir/$pattern" 2>/dev/null || stat -f%z "$dest_dir/$pattern")
            echo "Successfully staged $file -> $dest_dir/$pattern ($size bytes)"
          }

          copy_native "native-binaries/native-linux-x86_64-cpu" "bindings/java/libargus-native-linux-cpu/src/main/resources/natives/linux-amd64/cpu" "libargus.so"
          copy_native "native-binaries/native-linux-x86_64-cuda" "bindings/java/libargus-native-linux-cuda/src/main/resources/natives/linux-amd64/cuda" "libargus.so"
          copy_native "native-binaries/native-linux-x86_64-rocm" "bindings/java/libargus-native-linux-rocm/src/main/resources/natives/linux-amd64/rocm" "libargus.so"
          copy_native "native-binaries/native-linux-x86_64-vulkan" "bindings/java/libargus-native-linux-vulkan/src/main/resources/natives/linux-amd64/vulkan" "libargus.so"
          copy_native "native-binaries/native-windows-x86_64-cpu" "bindings/java/libargus-native-windows-cpu/src/main/resources/natives/windows-amd64/cpu" "argus.dll"
          copy_native "native-binaries/native-windows-x86_64-cuda" "bindings/java/libargus-native-windows-cuda/src/main/resources/natives/windows-amd64/cuda" "argus.dll"
          copy_native "native-binaries/native-windows-x86_64-vulkan" "bindings/java/libargus-native-windows-vulkan/src/main/resources/natives/windows-amd64/vulkan" "argus.dll"
          copy_native "native-binaries/native-macos-aarch64-metal" "bindings/java/libargus-native-macos-metal/src/main/resources/natives/macos-aarch64/metal" "libargus.dylib"

      - name: Build Java Core & Native Classifier Jars
        run: |
          ./gradlew build -PskipCMake=true --info

      - name: Verify Packaged Native Classifier Jars
        run: |
          set -euo pipefail
          echo "Verifying compiled and packaged JAR artifacts..."

          core_jar=$(find bindings/java/libargus-core/build/libs -name "libargus-core-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$core_jar" ] || [ ! -f "$core_jar" ]; then
            echo "::error::Core JAR not found in bindings/java/libargus-core/build/libs" >&2
            exit 1
          fi
          core_size=$(stat -c%s "$core_jar" 2>/dev/null || stat -f%z "$core_jar")
          echo "Core JAR: $core_jar ($core_size bytes)"

          for d in bindings/java/libargus-native-*; do
            [ -d "$d" ] || continue
            subproject=$(basename "$d")
            jar_file=$(find "$d/build/libs" -name "${subproject}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" 2>/dev/null | head -n 1)

            if [ -z "$jar_file" ] || [ ! -f "$jar_file" ]; then
              echo "::error::Native JAR missing for $subproject" >&2
              exit 1
            fi

            jar_size=$(stat -c%s "$jar_file" 2>/dev/null || stat -f%z "$jar_file")
            echo "Checking $jar_file ($jar_size bytes)..."

            if [ "$jar_size" -lt 500000 ]; then
              echo "::error::$jar_file size ($jar_size bytes) is below minimum expected binary size (>500KB)!" >&2
              exit 1
            fi

            if ! jar tf "$jar_file" | grep -q "^natives/"; then
              echo "::error::$jar_file does NOT contain embedded native library under natives/!" >&2
              exit 1
            fi

            if [ "$subproject" = "libargus-native-linux-rocm" ]; then
              echo "Introspecting ROCm binary capabilities for $subproject..."
              unzip -p "$jar_file" natives/linux-amd64/rocm/libargus.so | strings | grep -iE "hip|rocm" | head -n 5 || {
                echo "::error::ROCm native library does not contain ROCm/HIP symbols!" >&2
                exit 1
              }
            fi
          done
          ./gradlew verifyPackagedClassifiers

          echo "Running isolated JVM verification on Linux CPU classifier..."
          linux_cpu_jar=$(find bindings/java/libargus-native-linux-cpu/build/libs -name "libargus-native-linux-cpu-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          ./gradlew verifyClassifierRuntime \
            -PclassifierJar="$linux_cpu_jar" \
            -PexpectedTarget="cpu"
          echo "All native classifier jars verified successfully with embedded binary payloads."

      - name: Publish to GitHub Packages Maven Registry
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository -PskipCMake=true --info || {
            echo "::warning::Publishing to GitHub Packages failed (likely already published). Continuing release pipeline..."
          }

      - name: Publish to Maven Central (Sonatype Central Portal)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "::error::Fatal: Missing required Maven Central publication credentials on release tag ${{ github.ref }}" >&2
              exit 1
            fi
            echo "::warning::MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, or GPG_PRIVATE_KEY is not set. Skipping Maven Central publication for non-tag workflow."
          else
            ./gradlew publishAggregationToCentralPortal \
              -PskipCMake=true \
              -PmavenCentralUsername="$MAVEN_CENTRAL_USERNAME" \
              -PmavenCentralPassword="$MAVEN_CENTRAL_PASSWORD" \
              --info
          fi

      - name: Generate Checksums & Metadata Manifest
        run: |
          set -euo pipefail
          echo "Generating SHA-256 checksums manifest..."
          find bindings/java/ -name "*.jar" -exec sha256sum {} + > checksums.txt
          find native-binaries/ -type f -exec sha256sum {} + >> checksums.txt
          cat checksums.txt

          echo "Generating structured manifest.json..."
          python3 - << 'EOF'
          import json, os, hashlib, glob

          manifest = {
              "version": "1.7.3",
              "artifacts": []
          }

          for filepath in sorted(glob.glob("bindings/java/**/*.jar", recursive=True) + glob.glob("native-binaries/**/*", recursive=True)):
              if os.path.isfile(filepath):
                  with open(filepath, "rb") as f:
                      content = f.read()
                      sha256 = hashlib.sha256(content).hexdigest()
                      size = len(content)
                  manifest["artifacts"].append({
                      "path": filepath,
                      "filename": os.path.basename(filepath),
                      "size_bytes": size,
                      "sha256": sha256
                  })

          with open("manifest.json", "w") as out:
              json.dump(manifest, out, indent=2)
          EOF
          cat manifest.json

      - name: Create GitHub Tagged Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bindings/java/libargus-core/build/libs/*.jar
            bindings/java/libargus-native-*/build/libs/*.jar
            native-binaries/**/*
            checksums.txt
            manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true

