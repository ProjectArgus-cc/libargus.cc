name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v1.7.11)
        required: true
        type: string
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.check.outputs.source }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact tag identity and Action references
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/release/pins.py
          python3 scripts/release/preflight.py "$TAG" > /tmp/preflight.json
          python3 -c 'import json,os; d=json.load(open("/tmp/preflight.json")); assert d["source"] == os.environ["WORKFLOW_SHA"], "Dispatch using the tag as workflow ref"; f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("source="+d["source"]+"\ntag="+d["tag"]+"\n")'
  validation:
    needs: preflight
    uses: ./.github/workflows/validation.yml
    with:
      source: ${{ needs.preflight.outputs.source }}
      release: true
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  publish:
    needs: [preflight, validation]
    if: needs.validation.result == 'success'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      packages: write
      actions: read
    with:
      source: ${{ needs.preflight.outputs.source }}
      tag: ${{ needs.preflight.outputs.tag }}
      run-id: ${{ github.run_id }}
      candidate-id: ${{ needs.validation.outputs.candidate-id }}
      receipts-id: ${{ needs.validation.outputs.receipts-id }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
